name: Build jet-core wheels

# This is what makes `pip install jet-framework[speed]` activate the
# Rust core INSTANTLY, with no compilation on the end user's machine:
# it builds a compiled wheel here in CI (across OS/arch), once, and
# publishes it to PyPI. From then on, installing is just downloading
# a binary -- exactly how orjson, ruff, and pydantic-core do it.
#
# Trigger this by pushing a tag like `jet-core-v0.6.0`, or manually
# via workflow_dispatch.
#
# Note: an earlier run of this workflow failed with a Docker exit
# error under the "Build wheel with maturin" step. That was the
# manylinux container surfacing a real cargo compile error underneath
# it (a dependency API mismatch), not a problem with the Docker step
# itself -- once rust/Cargo.toml and rust/src/lib.rs compile cleanly,
# this step succeeds normally.
#
# The `linux-musl-aarch64` entry below targets 64-bit ARM devices
# running a musl-based distro (e.g. Alpine Linux on a phone) --
# confirmed via `python -m pip debug --verbose`, which reported
# `musllinux_*_armv8l`/`aarch64` compatible tags on the target device.
# `ubuntu-latest` itself is x86_64; maturin-action cross-compiles to
# aarch64-musl inside a Docker container for that entry, so it will
# take noticeably longer than the plain x86_64 build.

on:
  push:
    tags:
      - "jet-core-v*"
  workflow_dispatch: {}

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-glibc
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto

          - name: linux-aarch64-musl
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2

          - name: macos-universal2
            runner: macos-latest
            target: universal2-apple-darwin
            manylinux: "off"

          - name: windows-x86_64
            runner: windows-latest
            target: ""
            manylinux: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel with maturin
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: --release --out dist
          # abi3-py38 (set in rust/Cargo.toml) means ONE wheel per
          # OS/architecture covers every Python 3.8+ -- no per-version
          # build matrix needed.
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: rust/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/jet-core-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Requires a PyPI trusted publisher or PYPI_API_TOKEN secret
          # configured on this repo -- see:
          # https://docs.pypi.org/trusted-publishers/
