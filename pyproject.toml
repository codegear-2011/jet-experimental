[project]
name = "jet-framework"
version = "0.1.0"
description = "Jet — a lightweight, Python-first web framework."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Code Gear" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Activates the Rust core automatically -- once `jet-core` is
# published to PyPI as a prebuilt wheel (see rust/.github workflow),
# this installs a compiled binary directly, with NO local Rust
# toolchain or compile step required. Jet detects it at import time
# and switches engines automatically; see jet/router.py, jet/server.py,
# jet/response.py.
speed = ["jet-core>=0.4.0"]
rust = ["jet-core>=0.4.0"]  # alias, same thing

[project.scripts]
jet = "jet.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jet*"]
