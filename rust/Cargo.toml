[package]
name = "jet_core"
version = "0.4.0"
edition = "2021"
description = "Jet's performance core: xitca-web/Tokio async server, router, and JSON serialization, written in Rust and exposed to Python via PyO3 -- Robyn-style: multi-process workers plus a Rust async I/O layer, working on any standard Python 3.8+."
license = "MIT"

# Builds as a Python extension module (jet_core.so / .pyd)
[lib]
name = "jet_core"
crate-type = ["cdylib"]

[dependencies]
# Python bindings. `abi3-py38` builds one wheel that works unmodified
# against any CPython 3.8 and newer -- no free-threaded build, no
# per-version rebuild required. This mirrors how Robyn ships: it
# targets ordinary GIL-enabled Python, not a special interpreter.
#
# If you happen to be on Python 3.13/3.14 free-threaded, PyO3 detects
# that automatically at build time and this still works -- it's a
# bonus, not a requirement.
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }

# Async HTTP stack. xitca-web is a lower-level, lighter-weight async
# web framework than actix-web (no actor system, smaller dependency
# tree) built directly on hyper/tokio primitives. This is where the
# real GIL workaround lives: connection accept, HTTP parsing, and
# response serialization all run here, entirely outside the GIL,
# because no Python bytecode executes during any of it.
xitca-web = "0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Lets each worker *process* bind the same port (SO_REUSEPORT) so the
# kernel load-balances connections across processes. This is the
# primary way multi-core parallelism is achieved on ordinary
# (GIL-enabled) Python -- one interpreter and one GIL per process,
# many processes running at once. This is the same strategy Robyn,
# Gunicorn, and uvicorn's multi-worker mode use.
socket2 = { version = "0.5", features = ["all"] }

# Rust-side JSON encoding for Response.json(), avoiding Python's json
# module on the hot path.
serde_json = "1"

# Body collection and buffer types used by the xitca-web request/
# response bridge.
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

